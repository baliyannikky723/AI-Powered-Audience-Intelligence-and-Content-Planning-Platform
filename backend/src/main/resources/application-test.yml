spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsegpt_test_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:pulsegpt_secret_password}

app:
  memory:
    enabled: true
    half-life-days: 45
    evidence-window-days: 180
    active-threshold: 0.60
    weakening-threshold: 0.30
    max-confidence: 0.99
    confidence-scale-factor: 200.0

server:
  port: 0

logging:
  level:
    root: WARN
    com.pulsegpt: INFO

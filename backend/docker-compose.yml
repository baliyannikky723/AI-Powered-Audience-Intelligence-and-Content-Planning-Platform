version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulsegpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsegpt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsegpt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsegpt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: pulsegpt_ai_service
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      INTERNAL_API_KEY: pulse-internal-secret-key-3f8a9e
      REQUIRE_API_KEY: "true"
      OFFLINE_MODE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: pulsegpt_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/pulsegpt_secret_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsegpt_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulsegpt_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: pulsegpt_secret_password
      SERVER_PORT: 8080
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: pulse-internal-secret-key-3f8a9e
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
